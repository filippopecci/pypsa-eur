# Scenarios for pypsa-macro-italy: one per weather year 1995..2025.
# Each scenario overrides `snapshots` and `atlite.default_cutout`; everything
# else (countries, clustering, planning_horizons, solving, etc.) is inherited
# from config/config.macro.italy.yaml.
#
# Regenerate with:
#   python -c "
#   years = range(1995, 2026)
#   with open('config/scenarios.macro.italy.yaml', 'w') as f:
#       for y in years:
#           f.write(f'''yr{y}:
#     snapshots:
#       start: \"{y}-01-01\"
#       end: \"{y+1}-01-01\"
#       inclusive: left
#     atlite:
#       default_cutout: \"europe-{y}-sarah3-era5\"
#   ''')
#   "

yr1995:
  snapshots:
    start: "1995-01-01"
    end: "1996-01-01"
    inclusive: left
  atlite:
    default_cutout: "europe-1995-sarah3-era5"

