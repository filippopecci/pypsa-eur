# Scenarios for pypsa-macro-italy: one per weather year.
# Restricted to the 14 years pypsa-eur publishes as pre-built sarah3-era5 cutouts
# at https://data.pypsa.org/workflows/cutout/v1.0/ :
#   1995, 1996, 2008, 2009, 2010, 2012, 2013, 2019, 2020, 2021, 2022, 2023, 2024, 2025
# Each scenario overrides `snapshots` and `atlite.default_cutout`; everything else
# (countries, clustering, planning_horizons, solving, ...) is inherited from
# config/config.macro.italy.yaml.

yr1995:
  snapshots:
    start: "1995-01-01"
    end: "1996-01-01"
    inclusive: left
  atlite:
    default_cutout: "europe-1995-sarah3-era5"

