run:
  prefix: "pypsa-macro-italy"
  name: "all"                       # expands to every scenario in the file below
  scenarios:
    enable: true
    file: config/scenarios.macro.italy.yaml

# Override default: we BUILD cutouts via atlite+CDS for the years that
# data.pypsa.org doesn't pre-publish (1997-2007, 2011, 2014-2018).
# Cutouts for years that ARE prebuilt can still be downloaded once and
# dropped into data/cutout/build/unknown/ — snakemake will see them
# already exist and skip build_cutout. See cluster/prefetch_archives.lsf.
data:
  cutout:
    source: build
    version: latest

scenario:
  clusters:
  - "adm"
  planning_horizons:
  - 2025
  - 2030
  - 2035
  - 2040
  - 2045
  - 2050

foresight: myopic

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR', 'GB', 'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'ME', 'MK', 'NL', 'NO', 'PL', 'PT', 'RO', 'RS', 'SE', 'SI', 'SK', 'XK']

clustering:
  mode: administrative
  administrative:
    level: 0
    "IT": 2
  build_bidding_zones:
    remove_islands: true
    aggregate_to_tyndp: true
  temporal:
    resolution_elec: false
    resolution_sector: false

conventional:
  dynamic_fuel_price: true
  unit_commitment: false

transmission_projects:
  enable: false

renewable:
  onwind:
    resource_classes: 1
  offwind:
    resource_classes: 1
  offwind-ac:
    resource_classes: 1
  offwind-dc:
    resource_classes: 1
  offwind-float:
    resource_classes: 1
  solar:
    resource_classes: 1
  "solar-hsat":
    resource_classes: 1

sector:
  electricity_distribution_grid: false # true   #####
  gas_distribution_grid: false # true   #####

atlite:
  nprocesses: 16
  default_cutout: "europe-2013-sarah3-era5"   # base default; each scenario overrides
  cutouts:
    "europe-1995-sarah3-era5":
      module: [era5, sarah]
      x: [-12.0, 42.0]
      'y': [33.0, 72.0]
      dx: 0.3
      dy: 0.3
      time: ['1995', '1995']
      chunks: { time: 500 }
      prepare_kwargs:
        features: [temperature, height, runoff]
        sarah_dir:
        monthly_requests: true
        tmpdir: /work/cmcc/fp01525/tmp/cutouts_tmp
    "europe-1996-sarah3-era5":
