solving:
  solver:
    name: highs
    options: highs-default
  options:
    linearized_unit_commitment: true
  solver_options:
    gurobi-default:
      threads: 32
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-3
    highs-default:
      solver: "ipm"
      run_crossover: "off"
      ipm_optimality_tolerance: 1e-3
